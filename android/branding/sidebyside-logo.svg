<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="SideBySide">
  <defs>
    <linearGradient id="sbsGround" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7a4ff0"/>
      <stop offset="0.55" stop-color="#9a55d9"/>
      <stop offset="1" stop-color="#e56aa6"/>
    </linearGradient>
    <linearGradient id="sbsGlow" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <!-- Die Schnittmenge gehoert beiden Ringen: dort liegt Weiss voll auf. -->
    <clipPath id="sbsRight"><circle cx="315" cy="256" r="89.6"/></clipPath>
  </defs>

  <rect width="512" height="512" rx="114" fill="url(#sbsGround)"/>
  <rect width="512" height="512" rx="114" fill="url(#sbsGlow)"/>

  <g fill="none" stroke="#ffffff" stroke-width="41" opacity="0.78">
    <circle cx="197" cy="256" r="89.6"/>
    <circle cx="315" cy="256" r="89.6"/>
  </g>

  <g clip-path="url(#sbsRight)">
    <circle cx="197" cy="256" r="89.6" fill="none" stroke="#ffffff" stroke-width="41"/>
  </g>
</svg>
