{% if banner_text %}
<article class="no-padding primary-container">
    {% if settings.banner_image.value %}
    <img class="responsive" src="/api/v2/media/{{ settings.banner_image.value }}" alt="">
    {% else %}
    <img class="responsive" src="/api/v2/media/static/setup-couples.jpg" alt="">
    {% endif %}
    <div class="padding">
       <h5 class="middle-align center-align">
         {{ settings.anniversary_date.value|format_string_date_dmy if settings.anniversary_date.value else '' }}
      </h5>
       <p class="middle-align center-align">{{ banner_text }}</p>
       <div style="display:flex;justify-content:flex-end;gap:8px;">
         {% if settings.banner_song.value %}
         <button class="circle" id="btn-play-song" data-song="/api/v2/media/{{ settings.banner_song.value }}" onclick="toggleSong()">
           <i>play_arrow</i>
         </button>
         {% endif %}
         <button class="circle" id="btn-export-banner" onclick="exportBannerCard()">
           <i>ios_share</i>
         </button>
       </div>
    </div>
 </article>
{% endif %}
