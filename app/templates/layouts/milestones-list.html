<style>
.milestones-list {
   display: flex;
   flex-direction: column;
   width: 100%;
   margin: 0;
   padding: 0;
}

.milestone-list-item {
   position: relative;
   display: grid;
   grid-template-columns: 48px minmax(0, 1fr);
   gap: 0.8rem;
   padding: 0.85rem 0.25rem;
   cursor: pointer;
}

.milestone-list-item + .milestone-list-item {
   border-top: 1px solid var(--outline-variant);
}

.milestone-list-leading {
   position: relative;
   display: flex;
   justify-content: center;
   align-items: flex-start;
   padding-top: 0.15rem;
}

.milestone-list-icon {
   position: relative;
   z-index: 2;
   display: inline-flex;
   align-items: center;
   justify-content: center;
   width: 38px;
   height: 38px;
   border-radius: 50%;
   background: var(--primary-container);
   color: var(--on-primary-container);
   font-size: 1.45rem;
   font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 24;
}

.milestone-list-main {
   min-width: 0;
   padding: 0.1rem 0 0.2rem;
}

.milestone-list-title {
   margin: 0;
   font-weight: 600;
   line-height: 1.3;
   overflow-wrap: anywhere;
}

.milestone-list-date {
   margin-top: 0.2rem;
   font-size: 0.88rem;
   opacity: 0.72;
}

.milestone-list-description {
   margin-top: 0.45rem;
   white-space: pre-wrap;
   overflow-wrap: anywhere;
   line-height: 1.45;
}

.milestones-empty {
   text-align: center;
   padding: 2rem 1rem;
   opacity: 0.72;
}

@media (max-width: 600px) {
   .milestone-list-item {
      grid-template-columns: 42px minmax(0, 1fr);
      gap: 0.65rem;
      padding: 0.8rem 0;
   }

   .milestone-list-icon {
      width: 34px;
      height: 34px;
      font-size: 1.3rem;
   }
}
</style>

<article class="surface-container">
   <div class="padding">
      <h5 style="margin-top:0;">Unsere besonderen Momente</h5>

      {% if moments %}
      <div class="milestones-list">
         {% for moment, user in moments %}
         <div class="milestone-list-item"
              id="milestone-{{ moment.id }}"
              data-id="{{ moment.id }}"
              data-title="{{ moment.title }}"
              data-date="{{ moment.dateCreated|format_date_dmy }}"
              data-date-ymd="{{ moment.dateCreated|format_date_ymd }}"
              data-content="{{ moment.content or '' }}"
              onclick="showTimelineItemDetails(this)"
              role="button"
              tabindex="0"
              onkeydown="if(event.key === 'Enter' || event.key === ' '){event.preventDefault();showTimelineItemDetails(this);}">

            <div class="milestone-list-leading">
               <i class="milestone-list-icon">star</i>
            </div>

            <div class="milestone-list-main">
               <div class="milestone-list-title">
                  {{ moment.title or 'Meilenstein' }}
               </div>

               <div class="milestone-list-date">
                  {{ moment.dateCreated|format_date_dmy }}
               </div>

               {% if moment.content %}
               <div class="milestone-list-description">
                  {{ moment.content }}
               </div>
               {% endif %}
            </div>
         </div>
         {% endfor %}
      </div>
      {% else %}
      <div class="milestones-empty">
         Noch keine Meilensteine vorhanden.
      </div>
      {% endif %}
   </div>
</article>
